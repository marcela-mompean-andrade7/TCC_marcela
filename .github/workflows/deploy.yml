name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      
      - name: Atualizar variáveis de conexão no config.php
        run: |
          sed -i "s|\$host = 'localhost';|\$host = '${{ secrets.DB_HOST }}';|" config.php
          sed -i "s|\$port = '3308';|\$port = '${{ secrets.DB_PORT }}';|" config.php
          sed -i "s|\$db = 'mathplay';|\$db = '${{ secrets.DB_NAME }}';|" config.php
          sed -i "s|\$user = 'root';|\$user = '${{ secrets.DB_USER }}';|" config.php
          sed -i "s|\$pass = '';|\$pass = '${{ secrets.DB_PASS }}';|" config.php


      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /lunarisacademy.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
